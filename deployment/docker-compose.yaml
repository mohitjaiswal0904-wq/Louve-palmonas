name: louve-frontend

# Project directory = repo root (see Makefile --project-directory .).
# Build: docker compose -f deployment/docker-compose.yaml --project-directory . up -d --build

services:
  web:
    build:
      # Resolved relative to Compose project dir (Makefile: --project-directory . = louve-frontend root)
      context: .
      dockerfile: deployment/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://louve.palmonas.tech}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api-louve.palmonas.tech}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    image: louve-frontend:local
    container_name: louve-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PUBLISH_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Runtime only: where the Next.js server reaches the Go API (see docs/DEPLOYMENT.md).
      # Example same host: http://172.26.9.251:8080 or http://host.docker.internal:8080
      INTERNAL_API_URL: ${INTERNAL_API_URL:-}
